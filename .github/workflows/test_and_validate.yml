# Test changes that have been pushed to the master and dev branches

name: Testing and Validation

# Controls when the action will run.
on:
  push:
    branches: [ master, dev, notreal, release-* ]
  pull_request:
    branches: [ master, dev, notreal, release-* ]
  workflow_dispatch:

env:
  # Obtained from https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  # TODO: add something later that can check the runners for hyperthreading
  LINUX_NUM_PROC_CORES: 4
  MACOS_NUM_PROC_CORES: 3
  ASAN_OPTIONS: detect_leaks=false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Run general unit tests in linux environment
  test_unit:
    # The type of runner that the job will run on
    strategy:
      matrix:
        os: [ubuntu-22.04]
        compiler: [gcc, clang]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Checkout the commit
      uses: actions/checkout@v7
    
    - name: Build Unit Tests
      uses: ./.github/actions/ngen-build
      with:
        targets: "test_unit test_geopackage"
        build-cores: ${{ env.LINUX_NUM_PROC_CORES }}

    - name: Run Tests
      working-directory: ./cmake_build
      run: ./test/test_unit
      timeout-minutes: 15

    - name: Run GeoPackage Tests
      working-directory: ./cmake_build
      run: ./test/test_geopackage
      timeout-minutes: 15
    
    - name: Clean Up
      uses: ./.github/actions/clean-build

  # Test PET
  test_pet:
    # The type of runner that the job will run on
    strategy:
      matrix:
        os: [ubuntu-22.04]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Build PET Tests
        uses: ./.github/actions/ngen-build
        with:
          targets: "compare_pet"
          bmi_c: on
          build-cores: ${{ env.LINUX_NUM_PROC_CORES }}

      - name: Run Tests
        working-directory: ./cmake_build
        run: |
          ./test/compare_pet
        timeout-minutes: 15

      - name: Clean Up
        uses: ./.github/actions/clean-build

  # Test MPI remote nexus behavior in linux
  test_mpi_remote_nexus:
    # The type of runner that the job will run on
    strategy:
      matrix:
        os: [ubuntu-22.04]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Build Unit Tests
        uses: ./.github/actions/ngen-build
        with:
          targets: "test_remote_nexus"
          build-cores: ${{ env.LINUX_NUM_PROC_CORES }}
          use_mpi: 'ON'

      - name: run_tests
        working-directory: ./cmake_build
        run: mpirun --allow-run-as-root --oversubscribe -np 4 ./test/test_remote_nexus
        timeout-minutes: 15

      - name: Clean Up
        uses: ./.github/actions/clean-build

  # Build all code with MPI enabled in linux
  build_mpi_all:
    # The type of runner that the job will run on
    strategy:
      matrix:
        os: [ubuntu-22.04]
        compiler: [gcc, clang]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Build Everything
        uses: ./.github/actions/ngen-build
        with:
          targets: "all"
          build-cores: ${{ env.LINUX_NUM_PROC_CORES }}
          use_mpi: 'ON'
          use_python: 'ON'
          bmi_c: 'ON'
          bmi_fortran: 'ON'

      - name: Clean Up
        uses: ./.github/actions/clean-build


  # Run BMI C++ tests in linux environment
  test_bmi_cpp:
    # The type of runner that the job will run on
    strategy:
      matrix:
        os: [ubuntu-22.04]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      #make sure cxx bmi is initialized/ready
      - uses: ./.github/actions/ngen-submod-build
        with: 
          mod-dir: "extern/bmi-cxx/"

      - name: Build Unit Tests
        uses: ./.github/actions/ngen-build
        with:
          targets: "test_bmi_cpp"
          build-cores: ${{ env.LINUX_NUM_PROC_CORES }}

      - name: Run Tests
        working-directory: ./cmake_build
        run: |
          ./test/test_bmi_cpp
        timeout-minutes: 15

      - name: Clean Up Unit Test Build
        uses: ./.github/actions/clean-build

  # Run realization config tests in linux environment
  test_realization_config:
    # The type of runner that the job will run on
    strategy:
      matrix:
        os: [ubuntu-22.04]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      #make sure cxx bmi is initialized/ready
      - uses: ./.github/actions/ngen-submod-build
        with:
          mod-dir: "extern/bmi-cxx/"

      - name: Build Unit Tests
        uses: ./.github/actions/ngen-build
        with:
          targets: "test_realization_config"
          build-cores: ${{ env.LINUX_NUM_PROC_CORES }}

      - name: Run Tests
        working-directory: ./cmake_build
        run: |
          ./test/test_realization_config
        timeout-minutes: 15

      - name: Clean Up Unit Test Build
        uses: ./.github/actions/clean-build

  # Run BMI C tests in linux environment, and separating to isolate
  test_bmi_c:
    # The type of runner that the job will run on
    strategy:
      matrix:
        os: [ubuntu-22.04]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Build Unit Tests
        uses: ./.github/actions/ngen-build
        with:
          targets: "test_bmi_c"
          build-cores: ${{ env.LINUX_NUM_PROC_CORES }}
          bmi_c: 'ON'

      - name: run_bmi_c_tests
        working-directory: ./cmake_build
        run: |
          ./test/test_bmi_c
        timeout-minutes: 15

      - name: Clean Up Unit Test Build
        uses: ./.github/actions/clean-build

  # As with the BMI C ubuntu job, separate Fortran in linux tests to keep setups clean and cause of failures clear.
  test_bmi_fortran:
    # The type of runner that the job will run on
    strategy:
      matrix:
        os: [ubuntu-22.04]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Build Unit Tests
        uses: ./.github/actions/ngen-build
        with:
          targets: "test_bmi_fortran"
          build-cores: ${{ env.LINUX_NUM_PROC_CORES }}
          #is this required for this test?
          bmi_c: 'ON'
          bmi_fortran: 'ON'

      - name: Run Unit Tests
        working-directory: ./cmake_build
        run: |
          ./test/test_bmi_fortran
        timeout-minutes: 15

      - name: Clean Up Unit Test Build
        uses: ./.github/actions/clean-build

  # As with the BMI C ubuntu job, separate Python in linux tests to keep setups clean and cause of failures clear.
  test_bmi_python:
    # The type of runner that the job will run on
    strategy:
      matrix:
        os: [ubuntu-22.04]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out repository under $GITHUB_WORKSPACE, so job can access it
      - uses: actions/checkout@v7

      - name: Build Unit Tests
        uses: ./.github/actions/ngen-build
        with:
          targets: "test_bmi_python"
          build-cores: ${{ env.LINUX_NUM_PROC_CORES }}
          #is this required for this test?
          bmi_c: 'ON'
          use_python: 'ON'
          additional_python_requirements: 'extern/test_bmi_py/requirements.txt'

      - name: run_bmi_python_tests
        working-directory: ./cmake_build
        run: |
          . ../.venv/bin/activate
          ./test/test_bmi_python
        timeout-minutes: 15

      - name: Clean Up Unit Test Build
        uses: ./.github/actions/clean-build

  # As with the BMI C ubuntu job, separate multi BMI in linux tests to keep setups clean and cause of failures clear.
  test_bmi_multi:
    # The type of runner that the job will run on
    strategy:
      matrix:
        os: [ubuntu-22.04]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Build Unit Tests
        uses: ./.github/actions/ngen-build
        with:
          targets: "test_bmi_multi"
          build-cores: ${{ env.LINUX_NUM_PROC_CORES }}
          bmi_c: 'ON'
          bmi_fortran: 'ON'
          use_python: 'ON'
          additional_python_requirements: 'extern/test_bmi_py/requirements.txt'

      - name: Run Unit Tests
        working-directory: ./cmake_build
        run: |
          . ../.venv/bin/activate
          ./test/test_bmi_multi
        timeout-minutes: 15

      - name: Clean Up Unit Test Build
        uses: ./.github/actions/clean-build

  # Run BMI protocol tests in linux/unix environment
  test_bmi_protocols:
    # The type of runner that the job will run on
    strategy:
      matrix:
        os: [ubuntu-22.04]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Build BMI Protocol Unit Tests
        uses: ./.github/actions/ngen-build
        with:
          targets: "test_bmi_protocols"
          build-cores: ${{ env.LINUX_NUM_PROC_CORES }}

      - name: run_bmi_protocol_tests
        working-directory: ./cmake_build
        run: |
          ./test/test_bmi_protocols
        timeout-minutes: 15

      - name: Clean Up BMI Protocol Unit Test Build
        uses: ./.github/actions/clean-build

  # All macOS testing in one job: a single build with the union of the features
  # the Linux test jobs enable (except MPI), then each test binary in its own step.
  # Every test step runs as long as the build succeeded, so one failure doesn't
  # hide the results of the others.
  test_macos:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      # Python versions on the macOS runner can lack wheels for some packages
      # (e.g. pandas<3), which pip then builds from source. Cache pip's whole
      # cache directory: wheels it built (wheels/) and files it downloaded
      # (http-v2/), so later runs reuse both. Cache entries can't be updated,
      # so each run that adds to pip's cache saves a new entry (keyed by run
      # ID) and runs restore the most recent one. pip only uses cached files
      # that match the package versions and Python it needs.
      - name: Restore pip Cache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/pip
          key: pip-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            pip-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: List Restored pip Cache
        run: |
          mkdir -p ~/Library/Caches/pip
          find ~/Library/Caches/pip -type f | sort > $RUNNER_TEMP/pip-cache-before.txt
          find ~/Library/Caches/pip/wheels -name '*.whl' 2>/dev/null | sort
          echo "$(wc -l < $RUNNER_TEMP/pip-cache-before.txt) files in pip cache"

      - name: Build Tests
        id: build
        uses: ./.github/actions/ngen-build
        with:
          targets: "test_unit test_geopackage compare_pet test_realization_config test_bmi_cpp test_bmi_c test_bmi_fortran test_bmi_python test_bmi_multi test_bmi_protocols"
          build-cores: ${{ env.MACOS_NUM_PROC_CORES }}
          bmi_c: 'ON'
          bmi_fortran: 'ON'
          use_python: 'ON'
          additional_python_requirements: 'extern/test_bmi_py/requirements.txt'

      # Save right after the build, so the cache is kept even if a test fails,
      # and only when pip added files that weren't in the restored cache
      - name: Check for New pip Cache Files
        id: new-pip-files
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          find ~/Library/Caches/pip -type f | sort > $RUNNER_TEMP/pip-cache-after.txt
          if cmp -s $RUNNER_TEMP/pip-cache-before.txt $RUNNER_TEMP/pip-cache-after.txt
          then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "$(comm -13 $RUNNER_TEMP/pip-cache-before.txt $RUNNER_TEMP/pip-cache-after.txt | wc -l) new files; new wheels built:"
            comm -13 $RUNNER_TEMP/pip-cache-before.txt $RUNNER_TEMP/pip-cache-after.txt | grep '\.whl$' || true
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Save pip Cache
        if: ${{ !cancelled() && steps.new-pip-files.outputs.changed == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/pip
          key: pip-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Run Unit Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ./cmake_build
        run: |
          . ../.venv/bin/activate
          ./test/test_unit
        timeout-minutes: 15

      - name: Run GeoPackage Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ./cmake_build
        run: |
          . ../.venv/bin/activate
          ./test/test_geopackage
        timeout-minutes: 15

      - name: Run PET Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ./cmake_build
        run: |
          . ../.venv/bin/activate
          ./test/compare_pet
        timeout-minutes: 15

      - name: Run Realization Config Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ./cmake_build
        run: |
          . ../.venv/bin/activate
          ./test/test_realization_config
        timeout-minutes: 15

      - name: Run BMI C++ Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ./cmake_build
        run: |
          . ../.venv/bin/activate
          ./test/test_bmi_cpp
        timeout-minutes: 15

      - name: Run BMI C Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ./cmake_build
        run: |
          . ../.venv/bin/activate
          ./test/test_bmi_c
        timeout-minutes: 15

      - name: Run BMI Fortran Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ./cmake_build
        run: |
          . ../.venv/bin/activate
          ./test/test_bmi_fortran
        timeout-minutes: 15

      - name: Run BMI Python Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ./cmake_build
        run: |
          . ../.venv/bin/activate
          ./test/test_bmi_python
        timeout-minutes: 15

      - name: Run BMI Multi Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ./cmake_build
        run: |
          . ../.venv/bin/activate
          ./test/test_bmi_multi
        timeout-minutes: 15

      - name: Run BMI Protocol Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ./cmake_build
        run: |
          . ../.venv/bin/activate
          ./test/test_bmi_protocols
        timeout-minutes: 15

      - name: Clean Up
        if: ${{ !cancelled() }}
        uses: ./.github/actions/clean-build

